<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
    <!-- 看板背景 -->
    <rect x="10" y="15" width="80" height="70" rx="4" ry="4" fill="none" stroke="currentColor" stroke-width="2"/>
    
    <!-- 三列板块 -->
    <rect x="15" y="20" width="20" height="60" rx="2" ry="2" fill="currentColor" opacity="0.1"/>
    <rect x="40" y="20" width="20" height="60" rx="2" ry="2" fill="currentColor" opacity="0.1"/>
    <rect x="65" y="20" width="20" height="60" rx="2" ry="2" fill="currentColor" opacity="0.1"/>
    
    <!-- 卡片 -->
    <!-- 第一列卡片 -->
    <rect x="17" y="25" width="16" height="8" rx="1" ry="1" fill="currentColor" opacity="0.6"/>
    <rect x="17" y="36" width="16" height="8" rx="1" ry="1" fill="currentColor" opacity="0.6"/>
    <rect x="17" y="47" width="16" height="8" rx="1" ry="1" fill="currentColor" opacity="0.6"/>
    
    <!-- 第二列卡片 -->
    <rect x="42" y="25" width="16" height="8" rx="1" ry="1" fill="currentColor" opacity="0.6"/>
    <rect x="42" y="36" width="16" height="8" rx="1" ry="1" fill="currentColor" opacity="0.6"/>
    
    <!-- 第三列卡片 -->
    <rect x="67" y="25" width="16" height="8" rx="1" ry="1" fill="currentColor" opacity="0.6"/>
    <rect x="67" y="36" width="16" height="8" rx="1" ry="1" fill="currentColor" opacity="0.6"/>
    <rect x="67" y="47" width="16" height="8" rx="1" ry="1" fill="currentColor" opacity="0.6"/>
    <rect x="67" y="58" width="16" height="8" rx="1" ry="1" fill="currentColor" opacity="0.6"/>
    
    <!-- 列标题线 -->
    <line x1="15" y1="22" x2="35" y2="22" stroke="currentColor" stroke-width="1.5" opacity="0.8"/>
    <line x1="40" y1="22" x2="60" y2="22" stroke="currentColor" stroke-width="1.5" opacity="0.8"/>
    <line x1="65" y1="22" x2="85" y2="22" stroke="currentColor" stroke-width="1.5" opacity="0.8"/>
</svg> 